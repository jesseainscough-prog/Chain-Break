/* 2.5.4 fixed app layout */
html,body{width:100%;height:100%;overflow:hidden}
body{touch-action:manipulation}

  max-height:100svh;

.brand{font-size:26px}
.tag{font-size:9px}

.card{margin-top:6px;padding:7px;border-radius:17px}

.gameCard{flex:0 0 auto;display:block;min-height:0}
.gameCard .arena{
  width:min(100%,330px);
  margin:0 auto;
  display:grid;
  grid-template-columns:26px minmax(0,1fr) 26px;

}

  width:100%;

}

  margin-top:5px;
  padding:5px 8px;
  border-radius:11px;
  font-size:11px;
  line-height:1.2;
}

.tutorial{flex:0 0 auto;margin:6px 0 0}
.tutorialCard{padding:7px 9px;border-radius:14px}
.tutorialCard h2{font-size:14px;margin:0 0 2px}

.slot{height:47px;aspect-ratio:auto;border-radius:10px}
.controls{flex:0 0 auto;gap:6px;margin-top:6px}
.btn{padding:10px 7px;font-size:13px;border-radius:12px}

/* Old rules are gone; never allow legacy copies to appear. */
.how,.rules{display:none!important}


/* 2.5.5 gate alignment fix */
.gameCard .arena{
  width:min(100%,330px);
  margin:0 auto;
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 28px;

<body>
<div class="app">
  <div class="top">
    <div><div class="brand">🔗 ChainBreak</div><div class="tag">PLAYABLE PROTOTYPE <span class="version">VERSION 2.5.7</span></div></div>
    <div class="moves"><div class="levelLabel">Level <span id="levelNum">1</span></div>Moves Left<b id="moves">0</b><div class="coinHud"><span class="coinDot"></span><span id="coinCount">0</span></div></div>
  </div>

  <div class="card gameCard">
    <div class="arena">
      <div class="gatesTop" id="gatesTop"></div>
      <div class="gatesLeft" id="gatesLeft"></div>
      <div class="board" id="board"></div>
      <div class="gatesRight" id="gatesRight"></div>
      <div class="gatesBottom" id="gatesBottom"></div>

    <div class="status" id="status" style="display:none"></div>

  <div class="card trayCard">

    <div class="tray" id="tray"></div>

  <div class="controls">
    <button class="btn secondary" id="undo">↶ Undo</button>
    <button class="btn secondary" id="reset">↻ Reset</button>
    <button class="btn" id="hint">💡 Hint</button>
  </div>
  <button class="btn nextLevel" id="nextLevel" style="display:none!important">Next Level →</button>
</div>



<div class="tutorialOverlay" id="tutorialOverlay">
  <div class="tutorialPop">
    <div class="tutorialPopTitle" id="tutorialPopTitle">Match the colors</div>
    <div class="tutorialPopText" id="tutorialPopText">Drag the cube to the matching gate.</div>
    <div class="tutorialPractice" id="tutorialPractice">
      <div class="practicePiece red" id="practicePiece"></div>
      <div class="practiceArrow">→</div>
      <div class="practiceGate red" id="practiceGate">↑</div>
    </div>
    <div class="tutorialPopHint">Try it: drag the cube into the gate.</div>
  </div>
</div>

<div class="completeOverlay" id="completeOverlay">
  <div class="completeCard">
    <div class="completeTitle">Level Cleared! 🎉</div>
    <div id="completeStars" class="completeStars">★★★</div>
    <div id="completeScore" class="completeScore"></div>
    <div class="coinReward"><span class="coinDot"></span><span id="coinReward">+0</span></div>
    <button class="nextBig" id="nextOverlay">Next Level</button>
    <div class="shopNote">Coins can later be used for boosts like +5 moves or extra lives.</div>
  </div>
</div>

function neighbors(r,c){return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>rr>=0&&rr<6&&cc>=0&&cc<6)}
function reachableFrom(sr,sc,ignoreCells=[]){
  const ignore=new Set(ignoreCells.map(([r,c])=>r+","+c));

    const [r,c]=q.shift();

function canChainMoveTo(targetR,targetC,originR,originC){
  const cells=chainCells(); if(cells.length!==2)return false;
  const [a,b]=cells;
  const clicked=(a[0]===originR&&a[1]===originC)?a:b;
  const other=clicked===a?b:a;

  const destOther=[other[0]+dr,other[1]+dc];
  if(destOther[0]<0||destOther[0]>=6||destOther[1]<0||destOther[1]>=6)return false;
  const own=new Set(cells.map(([r,c])=>r+","+c));
  const dests=[[targetR,targetC],destOther];
  if(dests.some(([r,c])=>board[r][c]&&!own.has(r+","+c)))return false;

  if(dr!==0&&dc!==0)return false;

    for(let i=1;i<=steps;i++){
      const rr=r+sr*i,cc=c+sc*i,k=rr+","+cc;
      if(rr<0||rr>=6||cc<0||cc>=6)return false;
      if(board[rr][cc]&&!own.has(k))return false;
    }
  }
  return true;
}

    ended=true;

    setStatus(`Level ${currentLevel+1} cleared with ${left} move${left===1?"":"s"} left! 🎉`,"win");
    showCompleteOverlay();

  }

function moveBoardToBoard(sr,sc,tr,tc){
  if(ended||!board[sr][sc]||board[tr][tc])return false;
  const v=board[sr][sc];
  if(v==="crate"||v==="crate1"||isLocked(v))return false;
  pushHistory();
  if(isChain(v)){
    if(!canChainMoveTo(tr,tc,sr,sc)){history.pop();setStatus("The chained pair has to slide together in a clear straight path.");return false}
    const cells=chainCells(), clicked=cells.find(([r,c])=>r===sr&&c===sc), other=cells.find(x=>x!==clicked);
    const dr=tr-sr,dc=tc-sc, od=[other[0]+dr,other[1]+dc];
    const oldVals=cells.map(([r,c])=>board[r][c]);cells.forEach(([r,c])=>board[r][c]=null);
    board[tr][tc]=v;board[od[0]][od[1]]=oldVals[cells.indexOf(other)];
    moves++;tryChainClear();selected=null;render();checkWin();return true
  }
  const reachable=reachableFrom(sr,sc);
  if(!reachable.some(([r,c])=>r===tr&&c===tc)){history.pop();setStatus("There isn't a clear path to that space.");return false}
  board[tr][tc]=v;board[sr][sc]=null;moves++;selected=null;
  clearIfAtGate(tr,tc);maybeOpenLock();render();checkWin();return true
}
function boardToTray(r,c){
  if(ended||tray.length>=4)return false;
  const v=board[r][c];if(!v||v==="crate"||v==="crate1"||isLocked(v))return false;
  pushHistory();
  if(isChain(v)){
    const cells=chainCells();if(cells.length!==2||tray.length>2){history.pop();setStatus("The linked pair needs two open holding slots.");return false}
    const vals=cells.map(([rr,cc])=>board[rr][cc]);
    const origin={type:"chain",cells:cells.map(([rr,cc],idx)=>({r:rr,c:cc,v:vals[idx]}))};
    cells.forEach(([rr,cc])=>board[rr][cc]=null);
    tray.push(vals[0],vals[1]);trayOrigins.push(origin,origin);
    moves++;setStatus("Linked pair parked in Holding. It must return to the same two spaces.");
  }else{
    board[r][c]=null;tray.push(v);trayOrigins.push({type:"single",r,c});
    moves++;setStatus(`${cap(baseColor(v))} parked in Holding. It must return to its original space.`);

}
function trayToBoard(i,r,c){
  if(ended||!tray[i])return false;
  const v=tray[i],origin=trayOrigins[i];
  if(!origin)return false;
  if(isChain(v)){
    const mateIndex=tray.findIndex((x,j)=>j!==i&&isChain(x)&&trayOrigins[j]===origin);
    if(mateIndex<0||origin.type!=="chain"){setStatus("The linked pair must return together.");return false}
    const cells=origin.cells;
    if(!cells.some(p=>p.r===r&&p.c===c)){setStatus("Holding pieces must return to the spaces they came from.");blockedFeedback();return false}
    if(cells.some(p=>board[p.r][p.c])){setStatus("The linked pair's original spaces are blocked.");blockedFeedback();return false}
    pushHistory();
    const idxs=[i,mateIndex].sort((a,b)=>b-a);idxs.forEach(x=>{tray.splice(x,1);trayOrigins.splice(x,1)});
    cells.forEach(p=>board[p.r][p.c]=p.v);

  }
  if(origin.type!=="single"||r!==origin.r||c!==origin.c){setStatus("A held piece can only return to the space it came from.");blockedFeedback();return false}

}
function render(){

function gateTarget(side,index){return side==="top"?[0,index]:side==="bottom"?[5,index]:side==="left"?[index,0]:[index,5]}

function canChainReachGate(originR,originC,side,index){
  const cells=chainCells();if(cells.length!==2)return false;
  const clicked=cells.find(([r,c])=>r===originR&&c===originC), other=cells.find(([r,c])=>!(r===originR&&c===originC));if(!clicked||!other)return false;
  const rel=[other[0]-clicked[0],other[1]-clicked[1]],own=new Set(cells.map(([r,c])=>r+","+c)),target=gateTarget(side,index);
  const valid=(r,c)=>{const r2=r+rel[0],c2=c+rel[1];if(r<0||r>=6||c<0||c>=6||r2<0||r2>=6||c2<0||c2>=6)return false;return (!board[r][c]||own.has(r+","+c))&&(!board[r2][c2]||own.has(r2+","+c2))};

  while(q.length){const [r,c]=q.shift();if(r===target[0]&&c===target[1])return true;for(const [nr,nc] of neighbors(r,c)){const k=nr+","+nc;if(!seen.has(k)&&valid(nr,nc)){seen.add(k);q.push([nr,nc])}}}return false
}
function clearChainViaGate(originR,originC,side,index){
  if(!canChainReachGate(originR,originC,side,index)){setStatus("The linked pair does not have a clear route to that gate yet.");return false}
  pushHistory();chainCells().forEach(([r,c])=>board[r][c]=null);moves++;cleared.blue=(cleared.blue||0)+2;selected=null;setStatus("Linked blue pair escaped together in one move! 🔗");maybeOpenLock();render();checkWin();return true
}
function gateTap(side,index){
  if(ended||!selected)return;const gate=gateAt(side,index);if(!gate)return;const [tr,tc]=gateTarget(side,index);
  if(selected.type==="tray"){setStatus("Pieces in Holding must return to their original space before they can use a gate.");blockedFeedback();return}
  const {r,c}=selected,v=board[r][c],color=baseColor(v);if(!color||isLocked(v))return;if(color!==gate.color){setStatus(`That piece needs a ${color} gate.`);return}if(isChain(v)){clearChainViaGate(r,c,side,index);return}

function hitCrate(r,c){

  render();checkWin()
}
function selectBoard(r,c){

  if(!v)return;
  if(v==="crate"||v==="crate1"){hitCrate(r,c);return}
  if(isLocked(v)){setStatus(`Clear ${lockRemaining()} more blue piece${lockRemaining()===1?"":"s"} to unlock this blue piece.`);return}
  if(selected&&selected.type==="board"&&selected.r===r&&selected.c===c){selected=null;setStatus("Selection cleared.");render();return}
  selected={type:"board",r,c};setStatus(isChain(v)?"Linked pair selected. Tap a reachable blue gate to clear both in one move, or slide them together.":"Piece selected. Tap a highlighted space, matching gate, or holding slot.");render()
}
function selectTray(i){
  const v=tray[i],o=trayOrigins[i];if(!v||!o)return;
  if(isChain(v)){
    const cells=o.type==="chain"?o.cells:[];
    if(cells.length!==2||cells.some(p=>board[p.r][p.c])){
      setStatus("The linked pair can't return yet — its original spaces are blocked.");
      blockedFeedback();
      cells.forEach(p=>document.querySelector(`.cell[data-r="${p.r}"][data-c="${p.c}"]`)?.classList.add("flashBlocked"));
      setTimeout(()=>document.querySelectorAll(".flashBlocked").forEach(x=>x.classList.remove("flashBlocked")),500);

  }

  const el=document.querySelector(`.cell[data-r="${o.r}"][data-c="${o.c}"]`);

  }

function emptyCellTap(r,c){if(!selected)return;if(selected.type==="board")moveBoardToBoard(selected.r,selected.c,r,c);else trayToBoard(selected.i,r,c)}

function gateNearPoint(x,y,src,pad=26){

  if(!cell)return;
  const r=+cell.dataset.r,c=+cell.dataset.c,key=r+","+c;
  const valid=(r===src.r&&c===src.c)||(!board[r][c]&&canChainMoveTo(r,c,src.r,src.c));
  if(!valid&&dragState?.lastBlocked!==key){dragState.lastBlocked=key;blockedFeedback();setStatus("Linked pair blocked — both squares must fit through the route.")}
  if(valid&&dragState)dragState.lastBlocked=null;
}
function finishDrag(src,x,y){
  if(dragState?.resolved)return;
  const before=moves;
  const target=document.elementFromPoint(x,y);
  const gate=target?.closest?.(".exit"),cell=target?.closest?.(".cell"),slot=target?.closest?.(".slot");
  if(src.type==="board"&&gate){selected={type:"board",r:src.r,c:src.c};gateTap(gate.dataset.side,+gate.dataset.index)}
  else if(src.type==="tray"&&gate){setStatus("Held pieces must return to their original space before using a gate.");blockedFeedback()}
  else if(src.type==="board"&&cell&&!cell.classList.contains("piece"))moveBoardToBoard(src.r,src.c,+cell.dataset.r,+cell.dataset.c);
  else if(src.type==="board"&&slot)boardToTray(src.r,src.c);
  else if(src.type==="tray"&&cell&&!cell.classList.contains("piece"))trayToBoard(src.i,+cell.dataset.r,+cell.dataset.c);
  else setStatus(src.type==="tray"?"Return the held piece to its highlighted original space.":"Drop on an open space, holding slot, or matching gate.");
  
}
function startDrag(e,src){
  if(!validDragSource(src))return;
  dragState={src,x:e.clientX,y:e.clientY,moved:false,resolved:false,pointerId:e.pointerId,origin:e.currentTarget,lastBlocked:null};
  const move=ev=>{
    if(!dragState||dragState.resolved)return;
    const dist=Math.hypot(ev.clientX-dragState.x,ev.clientY-dragState.y);
    if(dist>8&&!dragState.moved){dragState.moved=true;beginGhost(src,ev.clientX,ev.clientY,dragState.origin)}
    if(dragState.moved){moveGhost(ev.clientX,ev.clientY);if(tryPassThroughGate(src,ev.clientX,ev.clientY))return;updateChainDragFeedback(src,ev.clientX,ev.clientY)}
  };
  const up=ev=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",cancel);const moved=dragState?.moved,resolved=dragState?.resolved;if(moved&&!resolved){clearGhost();finishDrag(src,ev.clientX,ev.clientY)}else clearGhost();dragState=null};
  const cancel=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);clearGhost();dragState=null};
  document.addEventListener("pointermove",move,{passive:true});document.addEventListener("pointerup",up,{once:true});document.addEventListener("pointercancel",cancel,{once:true});
}
function startTouchDrag(e,src){
  if(!validDragSource(src)||e.touches.length!==1)return;const t=e.touches[0],origin=e.currentTarget;
  dragState={src,x:t.clientX,y:t.clientY,moved:false,resolved:false,touch:true,origin,lastBlocked:null};
  const move=ev=>{
    if(!dragState||dragState.resolved||!ev.touches[0])return;
    const q=ev.touches[0],dist=Math.hypot(q.clientX-dragState.x,q.clientY-dragState.y);
    if(dist>8&&!dragState.moved){dragState.moved=true;beginGhost(src,q.clientX,q.clientY,origin)}
    if(dragState.moved){ev.preventDefault();moveGhost(q.clientX,q.clientY);if(tryPassThroughGate(src,q.clientX,q.clientY))return;updateChainDragFeedback(src,q.clientX,q.clientY)}
  };
  const end=ev=>{document.removeEventListener("touchmove",move);document.removeEventListener("touchend",end);document.removeEventListener("touchcancel",cancel);const q=ev.changedTouches?.[0],moved=dragState?.moved,resolved=dragState?.resolved;if(moved&&q&&!resolved){ev.preventDefault();clearGhost();finishDrag(src,q.clientX,q.clientY)}else clearGhost();dragState=null};
  const cancel=()=>{document.removeEventListener("touchmove",move);document.removeEventListener("touchend",end);clearGhost();dragState=null};
  document.addEventListener("touchmove",move,{passive:false});document.addEventListener("touchend",end,{once:true,passive:false});document.addEventListener("touchcancel",cancel,{once:true});
}
function bindDrag(el,src){
  el.addEventListener("pointerdown",e=>startDrag(e,src));
  el.addEventListener("touchstart",e=>startTouchDrag(e,src),{passive:true});
}
function tutorialColorForLevel(){
  const d=LEVELS[currentLevel]?.demo;
  return d?.color||"red";
}
function showTutorial(){
  const level=LEVELS[currentLevel];
  if(!level?.tutorial)return;
  tutorialActive=true;
  const overlay=document.getElementById("tutorialOverlay");
  const title=document.getElementById("tutorialPopTitle");
  const text=document.getElementById("tutorialPopText");
  const piece=document.getElementById("practicePiece");
  const gate=document.getElementById("practiceGate");
  const color=tutorialColorForLevel();
  title.textContent=level.title||level.name||"How to play";
  text.textContent=level.tutorial+" "+(level.instruction||"");
  piece.className=`practicePiece ${color}`;
  gate.className=`practiceGate ${color}`;
  gate.textContent=level.demo?.side==="left"?"←":level.demo?.side==="right"?"→":level.demo?.side==="bottom"?"↓":"↑";
  piece.style.left="30px";piece.style.top="41px";
  overlay.classList.add("show");
}
function completeTutorial(){
  if(!tutorialActive)return;
  tutorialActive=false;
  document.getElementById("tutorialOverlay")?.classList.remove("show");
}
function completeTutorial(){
  if(!tutorialActive)return;tutorialActive=false;document.getElementById("tutorial").classList.add("hidden");setStatus("Nice — you got it! Keep going. ✅");
}
function loadLevel(index,show=true){
  currentLevel=Math.max(0,Math.min(index,LEVELS.length-1));gates=LEVELS[currentLevel].gates.map(g=>({...g}));board=copyBoard(LEVELS[currentLevel].board);tray=[];trayOrigins=[];moves=0;moveLimit=LEVELS[currentLevel].moveLimit;history=[];selected=null;cleared={};ended=false;dragState=null;tutorialActive=false;clearGhost();document.getElementById("nextLevel").classList.remove("show");setStatus(`Level ${currentLevel+1}: ${LEVELS[currentLevel].name}`);render();if(show)showTutorial();
}
function reset(){
  // Reset should always rebuild the board and restart the lesson for this level.
  document.getElementById("tutorial").classList.add("hidden");
  loadLevel(currentLevel,true);
}
function undo(){if(!history.length)return;const s=history.pop();restore(s);setStatus("Last move undone.")}
function pulseHint(pieceEl,gateEl,msg){
  document.querySelectorAll(".hintPulse").forEach(x=>x.classList.remove("hintPulse"));
  setStatus(msg);
  if(pieceEl){pieceEl.classList.add("hintPulse");setTimeout(()=>{pieceEl.classList.remove("hintPulse");if(gateEl)gateEl.classList.add("hintPulse")},750);}
  if(gateEl)setTimeout(()=>gateEl.classList.remove("hintPulse"),2750);
}
function hint(){
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){const v=board[r][c],color=baseColor(v);if(!color||isLocked(v))continue;for(const g of gates.filter(x=>x.color===color)){if(isChain(v)){if(!canChainReachGate(r,c,g.side,g.index))continue}else{const [tr,tc]=gateTarget(g.side,g.index),reach=reachableFrom(r,c);if(board[tr][tc]&&!(r===tr&&c===tc))continue;if(!(r===tr&&c===tc)&&!reach.some(([rr,cc])=>rr===tr&&cc===tc))continue}const pe=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`),ge=document.querySelector(`.exit[data-side="${g.side}"][data-index="${g.index}"]`);pulseHint(pe,ge,`Hint: move this ${color} piece to the flashing ${g.side} gate.`);return}}
  for(let r=0;r<6;r++)for(let c=0;c<6;c++)if(board[r][c]==="crate"||board[r][c]==="crate1"){pulseHint(document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`),null,"Hint: try breaking the flashing crate to open a route.");return}setStatus("Hint: move a blocker or use Holding to open a route.")
}
document.getElementById("reset").onclick=reset;document.getElementById("undo").onclick=undo;document.getElementById("hint").onclick=hint;document.getElementById("nextLevel").onclick=()=>loadLevel(currentLevel+1,true);

(function bindTutorialPractice(){
  const piece=document.getElementById("practicePiece");
  const gate=document.getElementById("practiceGate");
  const area=document.getElementById("tutorialPractice");
  let dragging=false,offX=0,offY=0;
  const gateHit=(x,y)=>{
    const r=gate.getBoundingClientRect();
    return x>=r.left-18&&x<=r.right+18&&y>=r.top-18&&y<=r.bottom+18;
  };
  const start=(x,y)=>{
    const r=piece.getBoundingClientRect();
    dragging=true;offX=x-r.left;offY=y-r.top;piece.classList.add("dragging");
  };
  const move=(x,y)=>{
    if(!dragging)return;
    const ar=area.getBoundingClientRect();
    const left=Math.max(0,Math.min(ar.width-piece.offsetWidth,x-ar.left-offX));
    const top=Math.max(0,Math.min(ar.height-piece.offsetHeight,y-ar.top-offY));
    piece.style.left=left+"px";piece.style.top=top+"px";
    gate.classList.toggle("ready",gateHit(x,y));
  };
  const end=(x,y)=>{
    if(!dragging)return;
    dragging=false;piece.classList.remove("dragging");
    if(gateHit(x,y)){
      gate.classList.remove("ready");
      gate.classList.add("success");
      if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
      setTimeout(()=>{gate.classList.remove("success");completeTutorial();},220);
    }else{
      piece.style.left="30px";piece.style.top="41px";gate.classList.remove("ready");
    }
  };
  piece.addEventListener("pointerdown",e=>{e.preventDefault();piece.setPointerCapture?.(e.pointerId);start(e.clientX,e.clientY)});
  piece.addEventListener("pointermove",e=>{if(dragging){e.preventDefault();move(e.clientX,e.clientY)}});
  piece.addEventListener("pointerup",e=>{e.preventDefault();end(e.clientX,e.clientY)});
  piece.addEventListener("pointercancel",()=>{dragging=false;piece.style.left="30px";piece.style.top="41px";gate.classList.remove("ready")});
  piece.addEventListener("touchstart",e=>{const t=e.touches[0];if(t){e.preventDefault();start(t.clientX,t.clientY)}},{passive:false});
  piece.addEventListener("touchmove",e=>{const t=e.touches[0];if(t&&dragging){e.preventDefault();move(t.clientX,t.clientY)}},{passive:false});
  piece.addEventListener("touchend",e=>{const t=e.changedTouches[0];if(t){e.preventDefault();end(t.clientX,t.clientY)}},{passive:false});
})();

document.getElementById("nextOverlay").onclick=()=>{
  document.getElementById("completeOverlay").classList.remove("show");
  if(currentLevel<LEVELS.length-1) loadLevel(currentLevel+1,true);
  else loadLevel(0,true);
};
